name: branch-deploy

on:
  issue_comment:
    types: [created]

# Permissions needed for reacting and adding comments for IssueOps commands
permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  branch-deploy:
    name: branch-deploy
    if: # only run on pull request comments and very specific comment body string as defined in our branch-deploy settings
      ${{ github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '.deploy') ||
      startsWith(github.event.comment.body, '.noop') ||
      startsWith(github.event.comment.body, '.lock') ||
      startsWith(github.event.comment.body, '.help') ||
      startsWith(github.event.comment.body, '.wcid') ||
      startsWith(github.event.comment.body, '.unlock')) }}
    runs-on: ubuntu-latest

    steps:
      - name: branch-deploy
        id: branch-deploy
        uses: github/branch-deploy@v10
        with:
          trigger: ".deploy"
          environment: "production"
          sticky_locks: "true" # https://github.com/github/branch-deploy/blob/1f6516ef5092890ce75d9e97ca7cbdb628e38bdd/docs/hubot-style-deployment-locks.md
          allow_forks: "false"
          stable_branch: "main"
          allow_sha_deployments: "false"

      - name: Require a trusted deployment target
        id: trusted-target
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_REF: ${{ steps.branch-deploy.outputs.ref }}
          DEPLOY_SHA: ${{ steps.branch-deploy.outputs.sha }}
        with:
          script: |
            if (process.env.DEPLOY_REF !== 'main') {
              throw new Error('PR deployments are disabled. Use .deploy main or .noop main.');
            }
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main'
            });
            if (process.env.DEPLOY_SHA !== branch.commit.sha) {
              throw new Error('The deployment SHA must match the current main commit. Retry the command.');
            }
            core.setOutput('sha', branch.commit.sha);

      - uses: actions/checkout@v4
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify the checked-out main commit
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        env:
          EXPECTED_SHA: ${{ steps.trusted-target.outputs.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::main changed during checkout. Retry the deployment command."
            exit 1
          fi

      - uses: ruby/setup-ruby@28c4deda893d5a96a6b2d958c5b47fc18d65c9d3 # pin@v1.213.0
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        with:
          bundler-cache: true

      - name: bootstrap
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        run: script/bootstrap

      # Here we run a deploy. It is "gated" by the IssueOps logic and will only run if the outputs from our branch-deploy step indicate that the workflow should continue
      - name: deploy
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        run: |
          set -o pipefail
          script/deploy | tee deploy.out
          bundle exec ruby script/ci/render_deploy_message.rb
          rm deploy.out
