name: checksum

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read
  packages: read

jobs:
  checksum:
    name: checksum
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@28c4deda893d5a96a6b2d958c5b47fc18d65c9d3 # pin@v1.213.0
        env:
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          bundler-cache: true

      - name: checksum audited entitlements
        run: examples/strictly_audited_checksum
